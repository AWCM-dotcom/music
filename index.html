<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的專屬影音盒</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 25px 15px;
      margin: 0;
    }
    h2 { font-size: 19px; margin-bottom: 10px; }
    #errorMsg { color: #ff5555; font-size: 14px; margin-bottom: 15px; font-weight: bold; }
    .controls { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .btn {
      background-color: #333333;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
    }
    .btn.active { background-color: #1DB954; color: #ffffff; }
    video { 
      width: 100%; 
      max-width: 420px; 
      margin-bottom: 20px; 
      border-radius: 10px;
      background-color: #000;
      height: 54px;
    }
    video.is-video { height: auto; min-height: 200px; }
    ul {
      list-style: none;
      padding: 0;
      max-width: 420px;
      margin: 0 auto;
      text-align: left;
      max-height: 50vh;
      overflow-y: auto;
    }
    li {
      padding: 12px 15px;
      border-bottom: 1px solid #242424;
      cursor: pointer;
      border-radius: 6px;
      font-size: 15px;
    }
    li.playing { background-color: #282828; color: #1DB954; font-weight: bold; }
  </style>
</head>
<body>

  <h2 id="nowPlaying">點擊按鈕開始播放</h2>
  <div id="errorMsg"></div>
  
  <div class="controls">
    <button id="btnOrder" class="btn active" onclick="startOrder()">▶ 順序播放</button>
    <button id="btnRandom" class="btn" onclick="startRandom()">🔀 隨機播放</button>
    <button id="btnRepeat" class="btn" onclick="toggleRepeat()">🔂 單曲重複：關</button>
  </div>

  <video id="mediaPlayer" controls playsinline webkit-playsinline></video>
  <ul id="songList"></ul>

  <script>
    const totalSongs = 14;  // MP3 數量
    const totalVideos = 1;  // MP4 數量

    const playlist = [];
    for (let num = 1; num <= totalSongs; num++) {
      playlist.push({ name: `🎵 曲目 #${num}`, file: `${num}.mp3`, type: 'audio' });
    }
    for (let num = 1; num <= totalVideos; num++) {
      playlist.push({ name: `🎬 影片 #${num}`, file: `${num}.mp4`, type: 'video' });
    }

    let currentIndex = 0;
    let isRandom = false;
    let isRepeat = false;

    const player = document.getElementById("mediaPlayer");
    const nowPlaying = document.getElementById("nowPlaying");
    const errorMsg = document.getElementById("errorMsg");
    const songList = document.getElementById("songList");
    const btnOrder = document.getElementById("btnOrder");
    const btnRandom = document.getElementById("btnRandom");
    const btnRepeat = document.getElementById("btnRepeat");

    playlist.forEach((item, index) => {
      const li = document.createElement("li");
      li.textContent = item.name;
      li.onclick = () => playTrack(index);
      songList.appendChild(li);
    });

    function playTrack(index) {
      currentIndex = index;
      const currentItem = playlist[currentIndex];
      errorMsg.textContent = ""; // 清除舊錯誤
      
      if (currentItem.type === 'video') {
        player.classList.add('is-video');
      } else {
        player.classList.remove('is-video');
      }

      player.src = currentItem.file;
      nowPlaying.textContent = `正在播放：${currentItem.name}`;
      
      const items = songList.getElementsByTagName("li");
      for (let i = 0; i < items.length; i++) {
        items[i].classList.toggle("playing", i === index);
      }
      
      player.play().catch(err => {
        errorMsg.textContent = `播放失敗原因：${err.message}`;
      });
    }

    // 偵測檔案找不到或格式不支援的錯誤
    player.addEventListener("error", () => {
      const errCode = player.error ? player.error.code : "未知";
      let reason = "";
      if (errCode === 4) reason = "找不到檔案 (檔名不是 1.mp4) 或影片編碼不支援";
      else if (errCode === 3) reason = "影片解碼失敗 (格式不相容)";
      else if (errCode === 2) reason = "網路連線中斷";
      else reason = "未知錯誤";
      errorMsg.textContent = `⚠️ 錯誤代碼 ${errCode}：${reason}`;
    });

    function startOrder() {
      isRandom = false;
      btnOrder.classList.add("active");
      btnRandom.classList.remove("active");
      playTrack(0);
    }

    function startRandom() {
      isRandom = true;
      btnRandom.classList.add("active");
      btnOrder.classList.remove("active");
      playNextRandom();
    }

    function playNextRandom() {
      let randomIndex;
      do {
        randomIndex = Math.floor(Math.random() * playlist.length);
      } while (randomIndex === currentIndex && playlist.length > 1);
      playTrack(randomIndex);
    }

    function toggleRepeat() {
      isRepeat = !isRepeat;
      btnRepeat.textContent = isRepeat ? "🔂 單曲重複：開" : "🔂 單曲重複：關";
      btnRepeat.classList.toggle("active", isRepeat);
    }

    player.addEventListener("ended", () => {
      if (isRepeat) {
        player.currentTime = 0;
        player.play();
      } else if (isRandom) {
        playNextRandom();
      } else {
        playTrack((currentIndex + 1) % playlist.length);
      }
    });
  </script>

</body>
</html>
